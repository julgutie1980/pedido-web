# Claude en CI · modo interactivo: responde a @claude en issues y pull requests.
# Basado en el ejemplo oficial «Respond to @claude mentions» (code.claude.com/docs/en/github-actions)
# y en unidad-6/taller/u6-respaldo del material del curso.
# Requiere la Claude GitHub App instalada en el repo y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (generado con `claude setup-token`). El token NUNCA va en este archivo.
# Regla del curso: Claude diagnostica; tú corriges y haces merge con el CI en verde.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude diagnostica
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--max-turns 5 --disallowedTools "Edit,Write"'
